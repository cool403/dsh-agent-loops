name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Fail unless the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag package-version=$version"
          test "$tag" = "$version"

      - name: Publish
        env:
          # Needed until this repository is registered as a Trusted Publisher on
          # npmjs.com. After that, delete the secret: with no token configured,
          # npm authenticates through OIDC and still attaches provenance.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # npm reads the token from .npmrc, not from the bare environment.
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
          fi
          npm publish --provenance --access public
