name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Fail unless the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag package-version=$version"
          test "$tag" = "$version"

      - name: Publish
        env:
          # Needed only for the very first release, before this repository is
          # registered as a Trusted Publisher on npmjs.com. Once that is set up,
          # remove the NPM_TOKEN secret: npm authenticates with OIDC instead.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
